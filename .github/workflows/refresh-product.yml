# The monthly product refresh, the same shape as refresh-mba.yml: one scrape job per ATS family of the product
# registry, then one job that merges the registry, pulls the backlog back, re-extracts, rebuilds the graph, runs the
# checks and opens a pull request from data/product-<date>. This is ./run_all.sh --refresh split into its stages
# (merge_registry, scrape, extract, build_graph; build_artifact writes the gitignored web/artifact.html and is left
# out), with the scrape run per family so no job nears the six-hour limit.
#
# First Sunday of the month, 05:17 New York (09:17 UTC): Actions cron cannot say "first Sunday" (day-of-month and
# day-of-week are OR'd), so the cron fires every Sunday and the gate lets the run go only when the day is 1 to 7.
# The repository variable REFRESH_PRODUCT_SCHEDULE must be "on". Secrets and the optional ACTIONS_PAT as in
# refresh-mba.yml.
name: refresh-product

on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:
    inputs:
      ats:
        description: "one ATS family, or all"
        default: all
      only:
        description: "employer names, comma-separated (empty: every employer of the family)"
        default: ""
      dry_run:
        description: "fetch, but write nothing to the backlog and open no pull request"
        type: boolean
        default: false

concurrency:
  group: refresh-product
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PIPELINE_JOB: refresh-product
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    name: secrets and schedule
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.go.outputs.go }}
      families: ${{ steps.families.outputs.families }}
    steps:
      - name: Every secret the jobs read is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::error::missing Actions secret(s):$missing. Add them under Settings > Secrets and variables > Actions (docs/OWNER_CHECKLIST_2026-10.md)."
            exit 1
          fi
          echo "the three secrets are set"
      - name: First Sunday of the month with the schedule on, or a dispatch
        id: go
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ vars.REFRESH_PRODUCT_SCHEDULE }}
        run: |
          if [ "$EVENT" = "schedule" ] && { [ "$SCHEDULE" != "on" ] || [ "$(date -u +%-d)" -gt 7 ]; }; then
            echo "scheduled run skipped: not the first Sunday, or REFRESH_PRODUCT_SCHEDULE is not 'on'"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The families this run scrapes
        id: families
        env:
          ATS: ${{ inputs.ats || 'all' }}
          # Every family data/registry.json uses (the product set). One line per family; a family a hosted runner cannot reach gets
          # "runner": ["self-hosted", "macOS"]. The list is built here, not in the scrape job's matrix, because a
          # job-level `if` cannot read `matrix` (GitHub rejects the whole file, and the schedule never fires).
          FAMILIES: |
            {"family": "workday", "runner": "ubuntu-latest"}
            {"family": "greenhouse", "runner": "ubuntu-latest"}
            {"family": "ashby", "runner": "ubuntu-latest"}
            {"family": "amazon", "runner": "ubuntu-latest"}
            {"family": "oracle_hcm", "runner": "ubuntu-latest"}
            {"family": "eightfold", "runner": "ubuntu-latest"}
            {"family": "google", "runner": "ubuntu-latest"}
            {"family": "lever", "runner": "ubuntu-latest"}
            {"family": "radancy", "runner": "ubuntu-latest"}
            {"family": "successfactors", "runner": "ubuntu-latest"}
            {"family": "apple", "runner": "ubuntu-latest"}
            {"family": "jibe", "runner": "ubuntu-latest"}
            {"family": "meta", "runner": "ubuntu-latest"}
            {"family": "smartrecruiters", "runner": "ubuntu-latest"}
            {"family": "phenom", "runner": "ubuntu-latest"}
            {"family": "mcloud", "runner": "ubuntu-latest"}
            {"family": "icims", "runner": "ubuntu-latest"}
            {"family": "bofa_servlet", "runner": "ubuntu-latest"}
            {"family": "paradox", "runner": "ubuntu-latest"}
            {"family": "gs_graphql", "runner": "ubuntu-latest"}
        run: |
          python3 - <<'PY'
          import json, os
          rows = [json.loads(line) for line in os.environ["FAMILIES"].splitlines() if line.strip()]
          ats = os.environ["ATS"]
          if ats != "all":
              rows = [r for r in rows if r["family"] == ats]
              if not rows:
                  raise SystemExit(f"::error::no family {ats!r} in this workflow")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("families=" + json.dumps(rows) + "\n")
          print(", ".join(r["family"] for r in rows))
          PY

  scrape:
    name: scrape ${{ matrix.family }}
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.families) }}
    env:
      FAMILY: ${{ matrix.family }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Name the log
        run: |
          mkdir -p logs
          echo "PIPELINE_LOG=logs/refresh-product_$(date -u +%Y-%m-%d)_${FAMILY}.log" >> "$GITHUB_ENV"
      - name: Merge the registry (what run_all.sh does first; from tracked files)
        run: python -m pipeline.merge_registry
      - name: Pull this family's part of the product backlog
        run: python -m pipeline.backlog pull --roles product --ats "$FAMILY"
      - name: Scrape ${{ matrix.family }}
        env:
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--refresh --ats "$FAMILY" --no-snapshot)
          if [ -n "$ONLY" ]; then
            args+=(--only)
            IFS=',' read -ra names <<< "$ONLY"
            for n in "${names[@]}"; do args+=("$(echo "$n" | sed 's/^ *//; s/ *$//')"); done
          fi
          [ "$DRY_RUN" = "true" ] && args+=(--no-db)
          python -m pipeline.scrape "${args[@]}"
      - name: Summarise the run for the pull request
        if: always()
        run: |
          mkdir -p summary
          python - "$FAMILY" "$PIPELINE_LOG" <<'PY'
          import json, os, re, sys
          from pipeline import log
          family, path = sys.argv[1], sys.argv[2]
          out = {"family": family, "counts": {}, "warnings": 0, "errors": 0, "partial": [], "failed": []}
          if os.path.exists(path):
              for line in open(path, encoding="utf-8", errors="replace"):
                  if " WARNING " in line:
                      out["warnings"] += 1
                      m = re.search(r"pipeline\.scrape: (.+?): partial fetch, (.+)$", line.rstrip())
                      if m: out["partial"].append(f"{m.group(1)} ({m.group(2)})")
                  elif " ERROR " in line:
                      out["errors"] += 1
                      m = re.search(r"pipeline\.scrape: (.+?) \(\w+\) failed after [^:]+: (\w+): (.{0,80})", line.rstrip())
                      if m: out["failed"].append(f"{m.group(1)}: {m.group(2)} {m.group(3)}")
                  elif "scrape done in" in line:
                      out["counts"] = log.counts_of(line.split("pipeline.scrape: ", 1)[-1])
          json.dump(out, open(f"summary/{family}.json", "w"), indent=1)
          print(json.dumps(out["counts"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-${{ matrix.family }}
          path: summary/
          retention-days: 30
      - name: Push the log to the logs store
        if: always()
        run: python -m pipeline.store push logs --only "$PIPELINE_LOG"

  build:
    name: merge registry, extract, build, checks, pull request
    needs: [gate, scrape]
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ secrets.ACTIONS_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.ACTIONS_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Name the log
        run: |
          mkdir -p logs summary
          echo "PIPELINE_LOG=logs/refresh-product_$(date -u +%Y-%m-%d)_build.log" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: summary/
          merge-multiple: true
      - name: Merge the registry
        run: python -m pipeline.merge_registry
      - name: Pull the product backlog
        run: python -m pipeline.backlog pull --roles product
      - name: Dated snapshot of the backlog (once per run)
        if: github.event_name == 'schedule' || (inputs.ats == 'all' && inputs.only == '')
        run: python -m pipeline.backlog snapshot --roles product
      - name: The text cache of the last extract
        # data/experiments/extract_cache_product.json.gz (pipeline.extract.TextCache): a two-core runner tags only the
        # texts that changed since the last run; without it a full extract outlasts the job
        run: python -m pipeline.store pull caches --only data/experiments/extract_cache_product.json.gz
      - name: Extract
        run: python -m pipeline.extract
      - name: Keep the text cache for the next run
        run: python -m pipeline.store push caches --only data/experiments/extract_cache_product.json.gz
      - name: Build the graph
        run: python -m pipeline.build_graph
      - name: The open postings of both role sets, for Find jobs (web/data/jobs_open.json and jobs_meta.json)
        run: python -m pipeline.jobs_open
      - name: Pipeline evals
        id: evals
        continue-on-error: true
        run: |
          set -o pipefail  # without it the step takes tee's exit status and a failing eval reads as a pass
          python evals/run_pipeline.py 2>&1 | tee summary/evals.txt
      - name: The checks CI runs
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          { node --test 'tests/web/*.test.mjs' && pytest tests/python && node evals/run.mjs && python evals/run_taxonomy.py && node evals/adaptive.mjs; } 2>&1 | tail -40 | tee summary/checks.txt
      - name: Push the log to the logs store
        if: always()
        run: python -m pipeline.store push logs --only "$PIPELINE_LOG"
      - name: Pull request from data/product-<date>
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVALS_OK: ${{ steps.evals.outcome }}
          CHECKS_OK: ${{ steps.checks.outcome }}
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "refresh-product (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/registry.json data/processed web/data)" ]; then echo "nothing changed; no pull request"; exit 0; fi
          branch="data/product-$DATE"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then branch="$branch-run${{ github.run_number }}"; fi
          python - "$RUN_URL" "$EVALS_OK" "$CHECKS_OK" > summary/body.md <<'PY'
          import glob, json, os, sys
          run_url, evals_ok, checks_ok = sys.argv[1:4]
          rows = [json.load(open(p)) for p in sorted(glob.glob("summary/*.json"))]
          lines = [f"Product refresh of {os.environ['DATE']} by the refresh-product workflow: [the run]({run_url}). "
                   + (f"Only: {os.environ['ONLY']}. " if os.environ.get("ONLY") else "")
                   + "Opened by the job; the owner reads the counts and merges. No job pushes to main.", "",
                   "| family | employers | fetched | kept | open | new | closed | partial | failed |", "|---|---|---|---|---|---|---|---|---|"]
          for r in rows:
              c = r["counts"]
              lines.append(f"| {r['family']} | {c.get('employers', 0)} | {c.get('postings fetched', 0)} | {c.get('kept', 0)} | {c.get('open', 0)} | {c.get('new', 0)} | {c.get('closed', 0)} | {len(r['partial'])} | {len(r['failed'])} |")
          notes = [f"- {r['family']}: partial {'; '.join(r['partial'])}" for r in rows if r["partial"]] + [f"- {r['family']}: failed {'; '.join(r['failed'])}" for r in rows if r["failed"]]
          if notes: lines += ["", "Partial fetches and failed employers:", ""] + notes
          lines += ["", f"Pipeline evals: {evals_ok}. CI's checks in the job: {checks_ok}.", ""]
          for name in ("evals.txt", "checks.txt"):
              if os.path.exists(f"summary/{name}"):
                  tail = open(f"summary/{name}", errors="replace").read().splitlines()[-25:]
                  lines += [f"<details><summary>{name}</summary>", "", "```", *tail, "```", "", "</details>", ""]
          print("\n".join(lines))
          PY
          git checkout -b "$branch"
          git add data/registry.json data/processed web/data
          git commit -q -m "Product refresh of $DATE (refresh-product run ${{ github.run_number }})"
          git push -u origin "$branch"
          # a refresh whose evals or checks failed opens as a draft that says so: never mistaken for a clean one
          if [ "$EVALS_OK" = success ] && [ "$CHECKS_OK" = success ]; then
            gh pr create --base main --head "$branch" --title "Product refresh of $DATE" --body-file summary/body.md
          else
            gh pr create --draft --base main --head "$branch" --title "Product refresh of $DATE (evals failed: do not merge)" --body-file summary/body.md
          fi
