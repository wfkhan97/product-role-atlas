# The monthly check of the standards index (pipeline/standards.json; PLAN.md, "A standards index"). One job: fetch
# every source once (one request at a time, two seconds apart, about 15 minutes), apply the date rules (read more than
# 12 months ago; a program not re-read since the last 1 August), run the eval with its freshness part, and post the
# report as an issue when anything is flagged. A person re-reads the flagged pages and opens the pull request.
#
# The job changes nothing: it has no write access to the contents, commits nothing, opens no pull request and merges
# nothing. Hosted runners are refused by more sites than a laptop is; those sources land under "needs a signed-in
# read", which is not a flag. No secrets are read.
#
# The 3rd of each month, 09:23 UTC. An open issue from an earlier month gets the new report as a comment.
name: verify-standards

on:
  schedule:
    - cron: "23 9 3 * *"
  workflow_dispatch:

concurrency:
  group: verify-standards
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: fetch, date rules, eval, issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Verify every source
        id: verify
        run: |
          mkdir -p summary
          python -m pipeline.standards verify --report summary/report.md
      - name: The eval, with its freshness part
        id: eval
        continue-on-error: true
        run: |
          set -o pipefail
          python evals/run_standards.py 2>&1 | tee summary/eval.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standards-verify
          path: summary/
          retention-days: 90
      - name: Post the report as an issue when something is flagged
        env:
          FLAGS: ${{ steps.verify.outputs.flags }}
          EVAL_OK: ${{ steps.eval.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat summary/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${FLAGS:-0}" = "0" ] && [ "$EVAL_OK" = success ]; then echo "nothing flagged; no issue"; exit 0; fi
          {
            echo "From the verify-standards workflow: [the run]($RUN_URL). Nothing was changed; a person re-reads the flagged pages and opens the pull request."
            echo
            echo "Eval (\`evals/run_standards.py\`, with freshness): $EVAL_OK."
            echo
            head -c 55000 summary/report.md
            echo; echo "<details><summary>eval</summary>"; echo; echo '```'; tail -40 summary/eval.txt; echo '```'; echo; echo "</details>"
          } > summary/body.md
          title="Standards index: sources to re-read"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file summary/body.md
          else
            gh issue create --title "$title ($(date -u +%Y-%m-%d))" --body-file summary/body.md
          fi
