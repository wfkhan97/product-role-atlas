# The monthly refresh of the tech role set (engineering, design, legal; PLAN.md "A third role set"). The same shape as
# refresh-product.yml for the scrape: one job per ATS family of the product registry, each pulling its part of the
# tech backlog, scraping with the set's sampling rules (US only, at most 30 open postings per employer and role, three
# pages a query on search boards; pipeline/scrape.py) and pushing to the Supabase backlog as it goes.
# Then one build job, as refresh-product has: pull the tech backlog, extract, build the graph and the set's baselines, run
# the checks, open a pull request from data/tech-<date> and merge it when every check passes (REFRESH_AUTO_MERGE=off
# leaves it open). The set is not shown in the interface until CONFIG.TECH_ENABLED, so its files can land on main first.
#
# count_only (dispatch): list the boards with the set's rules and upload the counts per employer and role as an
# artifact, with no detail fetches and nothing written to the backlog (Greenhouse, Lever, Ashby and Workday). Run it
# before the first real scrape.
#
# Second Sunday of the month, 06:17 New York (10:17 UTC), a week after refresh-product: the cron fires every Sunday and
# the gate lets the run go only on day 8 to 14 with the repository variable REFRESH_TECH_SCHEDULE set to "on".
name: refresh-tech

on:
  schedule:
    - cron: "17 10 * * 0"
  workflow_dispatch:
    inputs:
      ats:
        description: "one ATS family, or all"
        default: all
      only:
        description: "employer names, comma-separated (empty: every employer of the family)"
        default: ""
      count_only:
        description: "count what the rules would keep; fetch no details, write nothing"
        type: boolean
        default: true

concurrency:
  group: refresh-tech
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PIPELINE_JOB: refresh-tech
  PYTHONUNBUFFERED: "1"

jobs:
  gate:
    name: secrets and schedule
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.go.outputs.go }}
      families: ${{ steps.families.outputs.families }}
    steps:
      - name: Every secret the jobs read is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::error::missing Actions secret(s):$missing. Add them under Settings > Secrets and variables > Actions (docs/OWNER_CHECKLIST_2026-10.md)."
            exit 1
          fi
          echo "the three secrets are set"
      - name: Second Sunday of the month with the schedule on, or a dispatch
        id: go
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ vars.REFRESH_TECH_SCHEDULE }}
        run: |
          day=$(date -u +%-d)
          if [ "$EVENT" = "schedule" ] && { [ "$SCHEDULE" != "on" ] || [ "$day" -lt 8 ] || [ "$day" -gt 14 ]; }; then
            echo "scheduled run skipped: not the second Sunday, or REFRESH_TECH_SCHEDULE is not 'on'"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The families this run scrapes
        id: families
        env:
          ATS: ${{ inputs.ats || 'all' }}
          COUNT_ONLY: ${{ inputs.count_only }}
          # Every family data/registry.json uses. A count-only run lists the four families it can count without
          # detail fetches. The list is built here, not in the scrape job's matrix (a job-level `if` cannot read
          # `matrix`; GitHub rejects the whole file).
          FAMILIES: |
            {"family": "workday", "runner": "ubuntu-latest"}
            {"family": "greenhouse", "runner": "ubuntu-latest"}
            {"family": "ashby", "runner": "ubuntu-latest"}
            {"family": "lever", "runner": "ubuntu-latest"}
            {"family": "amazon", "runner": "ubuntu-latest"}
            {"family": "oracle_hcm", "runner": "ubuntu-latest"}
            {"family": "eightfold", "runner": "ubuntu-latest"}
            {"family": "google", "runner": "ubuntu-latest"}
            {"family": "radancy", "runner": "ubuntu-latest"}
            {"family": "successfactors", "runner": "ubuntu-latest"}
            {"family": "apple", "runner": "ubuntu-latest"}
            {"family": "jibe", "runner": "ubuntu-latest"}
            {"family": "meta", "runner": "ubuntu-latest"}
            {"family": "smartrecruiters", "runner": "ubuntu-latest"}
            {"family": "phenom", "runner": "ubuntu-latest"}
            {"family": "mcloud", "runner": "ubuntu-latest"}
            {"family": "icims", "runner": "ubuntu-latest"}
            {"family": "bofa_servlet", "runner": "ubuntu-latest"}
            {"family": "paradox", "runner": "ubuntu-latest"}
            {"family": "gs_graphql", "runner": "ubuntu-latest"}
        run: |
          python3 - <<'PY'
          import json, os
          rows = [json.loads(line) for line in os.environ["FAMILIES"].splitlines() if line.strip()]
          if os.environ.get("COUNT_ONLY") == "true":
              rows = [r for r in rows if r["family"] in ("workday", "greenhouse", "ashby", "lever")]
          ats = os.environ["ATS"]
          if ats != "all":
              rows = [r for r in rows if r["family"] == ats]
              if not rows:
                  raise SystemExit(f"::error::no family {ats!r} in this run")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("families=" + json.dumps(rows) + "\n")
          print(", ".join(r["family"] for r in rows))
          PY

  scrape:
    name: scrape ${{ matrix.family }}
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.families) }}
    env:
      FAMILY: ${{ matrix.family }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COUNT_ONLY: ${{ inputs.count_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Name the log
        run: |
          mkdir -p logs summary
          echo "PIPELINE_LOG=logs/refresh-tech_$(date -u +%Y-%m-%d)_${FAMILY}.log" >> "$GITHUB_ENV"
      - name: Merge the registry (from tracked files)
        run: python -m pipeline.merge_registry
      - name: Pull this family's part of the tech backlog
        if: env.COUNT_ONLY != 'true'
        run: python -m pipeline.backlog pull --roles tech --ats "$FAMILY"
      - name: Scrape ${{ matrix.family }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=(--roles tech --refresh --ats "$FAMILY" --no-snapshot)
          if [ -n "$ONLY" ]; then
            args+=(--only)
            IFS=',' read -ra names <<< "$ONLY"
            for n in "${names[@]}"; do args+=("$(echo "$n" | sed 's/^ *//; s/ *$//')"); done
          fi
          [ "$COUNT_ONLY" = "true" ] && args+=(--count-only "summary/count_${FAMILY}.json")
          python -m pipeline.scrape "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tech-${{ matrix.family }}
          path: summary/
          retention-days: 30
      - name: Push the log to the logs store
        if: always()
        run: python -m pipeline.store push logs --only "$PIPELINE_LOG"

  build:
    name: extract, build, checks, pull request
    needs: [gate, scrape]
    if: ${{ !cancelled() && needs.gate.outputs.go == 'true' && inputs.count_only != true }}
    runs-on: ubuntu-latest
    # 340, not 180: an extract with a cold text cache (any change to the taxonomy, pipeline/tax.py,
    # pipeline/extract.py or a depth file empties it) tags every posting on two cores, ~3.5 hours for the MBA set
    # of 2026-11-05; the refresh-mba run of that day was cancelled at 180 minutes with the scrape already done
    timeout-minutes: 340
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ secrets.ACTIONS_PAT || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.ACTIONS_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Name the log
        run: |
          mkdir -p logs summary
          echo "PIPELINE_LOG=logs/refresh-tech_$(date -u +%Y-%m-%d)_build.log" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Merge the registry
        run: python -m pipeline.merge_registry
      - name: Pull the tech backlog
        run: python -m pipeline.backlog pull --roles tech
      - name: Dated snapshot of the backlog (once per run)
        # in this job, after the pull: a snapshot reads data/raw/jobs_tech/, which a job of its own does not have
        if: github.event_name == 'schedule' || (inputs.ats == 'all' && inputs.only == '')
        run: python -m pipeline.backlog snapshot --roles tech
      - name: The text cache of the last extract
        run: python -m pipeline.store pull caches --only data/experiments/extract_cache_tech.json.gz || echo "no cache yet; tagging every text"
      - name: Extract
        run: python -m pipeline.extract --roles tech
      - name: Keep the text cache for the next run
        run: python -m pipeline.store push caches --only data/experiments/extract_cache_tech.json.gz
      - name: Build the graph and the extraction baseline
        run: |
          python -m pipeline.build_graph --roles tech
          python -m pipeline.experiments.role_coverage --roles tech
      - name: Pipeline and taxonomy evals of the set
        id: evals
        continue-on-error: true
        run: |
          set -o pipefail
          { python evals/run_pipeline.py --roles tech && node evals/run_tech.mjs && python evals/run_taxonomy.py; } 2>&1 | tee summary/evals.txt
      - name: The checks CI runs
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          { node --test 'tests/web/*.test.mjs' && pytest tests/python && node evals/run.mjs && python evals/run_pipeline.py; } 2>&1 | tail -40 | tee summary/checks.txt
      - name: Push the log to the logs store
        if: always()
        run: python -m pipeline.store push logs --only "$PIPELINE_LOG"
      - name: Pull request from data/tech-<date>
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVALS_OK: ${{ steps.evals.outcome }}
          CHECKS_OK: ${{ steps.checks.outcome }}
          AUTO_MERGE: ${{ vars.REFRESH_AUTO_MERGE }}
        run: |
          git config user.name "refresh-tech (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths="data/processed/jobs_tech.json data/processed/jobs_tech.json.gz data/processed/company_stage_tech.json data/processed/evidence_tech.json web/data/graph_tech.json web/data/graph_tech web/data/taxonomy_tech.json web/data/subskills_tech.json web/data/roles_tech.json evals/extraction_baseline_tech.md"
          existing=""
          for p in $paths; do [ -e "$p" ] && existing="$existing $p"; done
          if [ -z "$(git status --porcelain -- $existing)" ]; then echo "nothing changed; no pull request"; exit 0; fi
          branch="data/tech-$DATE"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then branch="$branch-run${{ github.run_number }}"; fi
          {
            echo "Tech role set refresh of $DATE by the refresh-tech workflow: [the run]($RUN_URL). Opened by the job, and merged by it when the set's evals and every CI check pass (REFRESH_AUTO_MERGE=off leaves it open); otherwise a draft for the owner. The set is not shown until CONFIG.TECH_ENABLED."
            echo
            echo "Evals: $EVALS_OK. CI's checks in the job: $CHECKS_OK."
            for name in evals.txt checks.txt; do
              [ -f "summary/$name" ] || continue
              echo; echo "<details><summary>$name</summary>"; echo; echo '```'; tail -25 "summary/$name"; echo '```'; echo; echo "</details>"
            done
          } > summary/body.md
          git checkout -b "$branch"
          git add $existing
          git commit -q -m "Tech role set refresh of $DATE (refresh-tech run ${{ github.run_number }})"
          git push -u origin "$branch"
          if [ "$EVALS_OK" != success ] || [ "$CHECKS_OK" != success ]; then
            gh pr create --draft --base main --head "$branch" --title "Tech refresh of $DATE (evals failed: do not merge)" --body-file summary/body.md
            exit 0
          fi
          url=$(gh pr create --base main --head "$branch" --title "Tech refresh of $DATE" --body-file summary/body.md)
          echo "$url"
          if [ "$AUTO_MERGE" = off ]; then echo "left open for the owner (REFRESH_AUTO_MERGE=off)"; exit 0; fi
          if ! gh pr merge "$url" --merge --match-head-commit "$(git rev-parse HEAD)"; then
            gh pr comment "$url" --body "The checks passed but the job could not merge this (see [the run]($RUN_URL)); merge it by hand or rerun the refresh."
            echo "::error::checks passed but the merge failed: $url"
            exit 1
          fi
          git push origin --delete "$branch" || echo "merged; the branch $branch is left behind"
