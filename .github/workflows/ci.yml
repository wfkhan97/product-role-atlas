# Tests and evals on every pull request and on main. The data the evals read (data/raw, web/data) is tracked in
# git, so a plain checkout is enough; no caching, no matrix.
#
# Measured locally on 2026-10-19 (Apple Silicon): node tests 0.2s, pytest 0.6s, evals/run.mjs 1.1s,
# evals/run_pipeline.py 21s. Expect about 1 minute for the checkout (400 MB of data) and 1 minute for the four
# commands on ubuntu-latest: 2 to 3 minutes a run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Web unit tests
        run: node --test 'tests/web/*.test.mjs'
      - name: Pipeline unit tests
        run: pytest tests/python
      - name: Matcher evals
        run: node evals/run.mjs
      - name: Pipeline evals
        run: python evals/run_pipeline.py
