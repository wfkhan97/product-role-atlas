ho":"You read and write a page. A few hours each.","clear":2,"missions":["l1-gtm","l1-leadership","l1-domain","l1-technical","l1-craft","l1-behaviours"]},{"n":2,"label":"Three demos in a day","release":"we do","who":"You build with help beside you. One day each.","clear":2,"missions":["l2-onepager","l2-battlecard","l2-howitworks"]},{"n":3,"label":"One project, real users","release":"you do","who":"You build for real users. Four to eight weeks.","clear":1,"missions":["l3-brief"]},{"n":"reach","label":"Reach","release":"you do","who":"A product-sized project with no deadline. It never blocks a world.","clear":0,"optional":true,"missions":["l4-library"]}],"cards":[{"id":"l1-gtm","level":1,"track":"gtm","title":"Positioning, read off Agentio's own pages","ship":"A one-page positioning read of Agentio in the atlas's terms: to whom (performance marketers at DTC and enterprise brands), against what alternative (Meta and Google ads, agencies, YouTube's own Creator Partnerships), and why better (automated sourcing to measurement, a closed and verified marketplace), with the sentence from each public page that carries the claim.","hours":3,"window":"an evening","why_role":{"text":"Nearly every PMM posting asks for positioning and messaging, and it sets the role apart. This posting makes the whole company story the job.","posting_quote":"The overarching Agentio story: what we offer, how it works, why customers love it"},"why_company":{"text":"Agentio positions itself against Meta and Google ads and against agencies. It explains the closed marketplace in its own words. So the read starts from those pages, not from a generic PMM template.","research_file":"product_and_launches.md","url":"https://www.agentio.com/blog/why-agentio-is-built-as-a-closed-creator-marketplace"},"why_person":{"text":"Positioning is a gap on the profile: the atlas reads it as must build. But the one-pager and pricing sheet she wrote for partners are positioning in another field's words.","profile_quote":"wrote the partner one-pager, the pricing sheet and the onboarding deck"},"atlas_skills":["positioning_messaging","gtm","market_research"],"classes":["TECH 5240","TECH 5111"],"sources":[{"title":"Why Agentio Is Built as a Closed Creator Marketplace","url":"https://www.agentio.com/blog/why-agentio-is-built-as-a-closed-creator-marketplace","read":"2026-10-26"},{"title":"Agentio home","url":"https://agentio.com","read":"2026-10-26"},{"title":"YouTube Creator Partnerships at NewFronts 2026","url":"https://blog.youtube/news-and-events/youtube-creator-partnerships-newfronts-2026/","read":"2026-10-26"}]},{"id":"l1-leadership","level":1,"track":"leadership","title":"Who hands you the brief, and who you hand the deck to","ship":"A map of the Narrative PMM's working relationships at a 35-to-50-person company: the sibling PMM who owns launches and data, the VP Marketing, sales and CS with their weekly collateral requests, and the growth, brand and events hires being made alongside, with what each one needs from the storyteller and when.","hours":2,"window":"an evening","why_role":{"text":"Most postings ask for cross-functional leadership and stakeholder management. This posting describes the role as a hand-off between a brief-writer and a storyteller.","posting_quote":"You work alongside a Product Marketing Manager who runs launches and owns the data. They hand you a brief with the key points, stats and must-mentions. You decide how to say them."},"why_company":{"text":"Six marketing roles are open at once, and the Product Marketing Lead is the first of its kind. So Agentio is building the team the Narrative PMM joins around them. The sibling postings say what each neighbor will expect.","research_file":"role_and_team.md","url":"https://jobs.ashbyhq.com/agentio/dd1be239-503f-47a8-a7a9-b25854f27371"},"why_person":{"text":"She has run a monthly call for eleven partners and fed what the field said back to product every week. What is new is doing it from marketing rather than sales.","profile_quote":"brought what they said back to the product team as a weekly note on asks, objections and lost deals"},"atlas_skills":["cross_functional","stakeholder_mgmt","customer_facing_exec"],"classes":[],"sources":[{"title":"Product Marketing Lead @ Agentio","url":"https://jobs.ashbyhq.com/agentio/dd1be239-503f-47a8-a7a9-b25854f27371","read":"2026-10-26"},{"title":"Agentio Ashby job board API","url":"https://api.ashbyhq.com/posting-api/job-board/agentio","read":"2026-10-26"},{"title":"Agentio: $40 Million Series B (Pulse 2.0)","url":"https://pulse2.com/agentio-series-b/","read":"2026-10-26"}]},{"id":"l1-domain","level":1,"track":"domain","title":"How Agentio sells when there is no pricing page","ship":"A short explainer of the commercial model a brand buys into: demo request, a closed marketplace with creators admitted on audience data, CPMs set by bidding and auto-priced on expected first-30-day views amortized over 90 days, performance-paid Meta ads with no test fee, the 20% fee on brand spend stated at launch, and what is simply not public.","hours":2,"window":"an evening","why_role":{"text":"Most PMM postings ask for enterprise SaaS and B2B. The posting wants a pitch that changes by SKU and brand type. That means knowing how the product sells.","posting_quote":"The modular pitch by SKU and brand type"},"why_company":{"text":"Agentio publishes no price list, SKUs or tiers. Its blog explains the bidding and amortization model. The demo form asks for monthly Meta spend bands. So the pitch has to carry the pricing logic the site does not.","research_file":"product_and_launches.md","url":"https://www.agentio.com/blog/what-to-look-for-in-a-creator-marketing-platform-in-2026"},"why_person":{"text":"She sold B2B software through partners on a quota and wrote the pricing sheet. The selling motion is familiar, even though the product is not.","profile_quote":"Carried an annual new-business quota for a freight-forwarding software suite sold to small and mid-sized forwarders"},"atlas_skills":["enterprise_saas","pricing_packaging","gtm"],"classes":["TECH 5111"],"sources":[{"title":"What to Look for in a Creator Marketing Platform in 2026","url":"https://www.agentio.com/blog/what-to-look-for-in-a-creator-marketing-platform-in-2026","read":"2026-10-26"},{"title":"Agentio Built A Platform For YouTube Creators To Sell Ad Slots (MediaPost, 2023)","url":"https://www.mediapost.com/publications/article/390707/agentio-built-a-platform-for-youtube-creators-to-s.html","read":"2026-10-26"},{"title":"Agentio Brings Automated Creator Advertising to Facebook and Instagram (PR Newswire)","url":"https://www.prnewswire.com/news-releases/agentio-brings-automated-creator-advertising-to-facebook-and-instagram-302823870.html","read":"2026-10-26"}]},{"id":"l1-technical","level":1,"track":"technical","title":"Enough AI to write a claim you can defend","ship":"A plain-language account of what Agentio's models do (match creators to goals, price on expected views, review drafts against brief and brand-safety rules, pick winners on Meta) and of which claims are company-reported, with one sentence per claim on what evidence would settle it; built from Agentio's own definition of AI-native and the Contrary Research memo.","hours":4,"window":"a weekend morning","why_role":{"text":"Most PMM postings ask for AI and machine learning. The atlas reads it as named, not shown, on the profile. The posting's company story is an AI-native story.","posting_quote":"Our AI-Native platform enables real-time content understanding at scale, simultaneous reasoning across hundreds of thousands of pieces of content, and intelligent allocation of multi-million dollar budgets."},"why_company":{"text":"Agentio defines AI-native as intelligence underneath the product that learns from every deal. The public evidence is a review agent and time-to-first-bid under a day. No one has ever benchmarked the models' accuracy. So the storyteller has to know where the line is.","research_file":"values_and_bets.md","url":"https://www.agentio.com/blog/what-ai-native-actually-means-in-influencer-marketing-and-why-it-matters"},"why_person":{"text":"Nothing on the profile shows AI fluency beyond a planned class. This card brings the class's reading forward to the company's own product.","profile_quote":"TECH 5280 Building AI Products"},"atlas_skills":["ai_ml","genai_llm","technical_fluency"],"classes":["TECH 5280"],"sources":[{"title":"What AI-Native Actually Means in Creator Marketing","url":"https://www.agentio.com/blog/what-ai-native-actually-means-in-influencer-marketing-and-why-it-matters","read":"2026-10-26"},{"title":"Agentio (Contrary Research memo, Sept 2026)","url":"https://research.contrary.com/company/agentio","read":"2026-10-26"},{"title":"Agentio secures $40 million from Forerunner (TechCrunch)","url":"https://techcrunch.com/2025/11/18/agentio-secures-40-million-from-forerunner-as-it-scales-its-creator-marketplace-beyond-youtube/","read":"2026-10-26"}]},{"id":"l1-craft","level":1,"track":"craft","title":"Two Agentio launches, read as launch briefs","ship":"The Meta Partnership Ads general availability (July 2026) and the Fairing integration (October 2026) each reduced to the brief the sibling PMM would have handed over: the key points, the stats, the must-mentions, the persona it speaks to, and what the enablement library had to change within the week.","hours":3,"window":"an evening","why_role":{"text":"Most PMM postings ask for product launches, and the atlas reads them as named, not shown, on the profile. The posting ties every asset to a launch brief and a one-week clock.","posting_quote":"each updated within a week of a launch brief"},"why_company":{"text":"The two launches in the window are public with their stats. The stats are higher ROAS in the Meta beta and net-new orders through Fairing. So a student can rebuild both briefs from the press release and the blog post without inventing a number.","research_file":"product_and_launches.md","url":"https://www.agentio.com/blog/unlocking-creator-roas-introducing-fairing-x-agentio-native-integration"},"why_person":{"text":"She has never written a launch. She has kept sales material current after every change, and that is the second half of this role.","profile_quote":"kept both current after every pricing or packaging change"},"atlas_skills":["launch","prioritization","sales_enablement"],"classes":["TECH 5200"],"sources":[{"title":"Unlocking Creator ROAS: Fairing x Agentio Native Integration","url":"https://www.agentio.com/blog/unlocking-creator-roas-introducing-fairing-x-agentio-native-integration","read":"2026-10-26"},{"title":"Agentio Brings Automated Creator Advertising to Facebook and Instagram (PR Newswire)","url":"https://www.prnewswire.com/news-releases/agentio-brings-automated-creator-advertising-to-facebook-and-instagram-302823870.html","read":"2026-10-26"},{"title":"Meta Automated Everything, Except Creative","url":"https://www.agentio.com/blog/meta-automated-everything-except-creative","read":"2026-10-26"}]},{"id":"l1-behaviours","level":1,"track":"behaviours","title":"Conservative but confident: how Agentio writes a claim","ship":"A style read of Agentio's own writing: how the blog states a number (the sample, the window, the comparison), where the press releases say company-reported, and which phrases leadership repeats (dollars follow attention; performance-grade pipes); with the rule the Product Marketing Lead posting sets for claims and five of Agentio's sentences rewritten to meet it.","hours":2,"window":"an evening","why_role":{"text":"Written and verbal communication is the role's most-asked skill. The atlas reads it as named, not shown, on the profile. The posting puts the sentence itself at the center of the job.","posting_quote":"If a customer has an aha moment reading our pitch, you wrote the sentence."},"why_company":{"text":"The Product Marketing Lead posting asks for conservative-but-confident claims that sophisticated audiences trust. The Brand Communications posting names the reputational stakes of inaccurate claims in ad-tech and AI. So the house style is a rule Agentio states, not a taste.","research_file":"role_and_team.md","url":"https://jobs.ashbyhq.com/agentio/07130e40-4ce1-4553-bb58-ff8fec187041"},"why_person":{"text":"She wrote 104 weekly issues to practitioners who would call out a wrong rate. The discipline of a checkable claim is hers; the ad-tech vocabulary is not.","profile_quote":"Wrote the weekly brief for two years (104 issues)"},"atlas_skills":["communication","ownership","data_driven"],"classes":[],"sources":[{"title":"Brand Communications & Events Lead @ Agentio","url":"https://jobs.ashbyhq.com/agentio/07130e40-4ce1-4553-bb58-ff8fec187041","read":"2026-10-26"},{"title":"One Week Later: YouTube's New View Count Has a 60% Engaged View Rate","url":"https://www.agentio.com/blog/youtube-new-view-count-60-engaged-view-rate","read":"2026-10-26"},{"title":"The CPG Guys podcast, the Agentio episode","url":"https://www.cpgguys.com/agentio/","read":"2026-10-26"}]},{"id":"l2-onepager","level":2,"track":"gtm","title":"The aha one-pager for a Shopify brand, from the Fairing launch","ship":"A two-page PDF a sales rep could send a DTC performance marketer tomorrow: the Fairing integration explained as the orders your pixel never sees, value-prop language for two personas (the performance buyer and the brand lead), the stats as must-mentions with their sources, and the brief it was written from on page two so the hand-off model is visible.","hours":8,"window":"a day","why_role":{"text":"The posting names the one-pager as an artifact and the aha layer as its test. A forwardable one-pager is the most direct proof of the role's core craft.","posting_quote":"The aha layer: value prop language per persona, modular story blocks, emotional copy"},"why_company":{"text":"The Fairing integration is Agentio's newest launch, on October 7, 2026. Its post carries the stats and the persona. The Shopify app listing says who the buyer is. No rep's one-pager for it exists in public yet.","research_file":"build_surfaces.md","url":"https://www.agentio.com/blog/unlocking-creator-roas-introducing-fairing-x-agentio-native-integration"},"why_person":{"text":"The partner one-pager and the onboarding deck are the closest thing on her profile to this artifact. This is the same document for a product she has not sold.","profile_quote":"wrote the partner one-pager, the pricing sheet and the onboarding deck"},"atlas_skills":["positioning_messaging","sales_enablement","personas_jtbd","customer_proof"],"classes":["NBAY 6090","TECH 5240"],"sources":[{"title":"Unlocking Creator ROAS: Fairing x Agentio Native Integration","url":"https://www.agentio.com/blog/unlocking-creator-roas-introducing-fairing-x-agentio-native-integration","read":"2026-10-26"},{"title":"Agentio on the Shopify App Store","url":"https://apps.shopify.com/agentio","read":"2026-10-26"},{"title":"A Guide to Measuring YouTube Creator Advertising","url":"https://www.agentio.com/blog/measurement-guide","read":"2026-10-26"}]},{"id":"l2-battlecard","level":2,"track":"domain","title":"A battlecard: Agentio against YouTube's own marketplace and the one rival with public prices","ship":"A one-page battlecard from public material only: Agentio versus YouTube Creator Partnerships (3M+ creators, inside Google Ads) and versus Collabstr (free tier, 10% hiring fee, published creator rates), with the objection each raises, the answer in Agentio's own words, the claims that stay conservative, and an empty win/loss column with the question that fills it.","hours":8,"window":"a day","why_role":{"text":"The posting names battlecards twice. Most PMM postings ask for market and competitive analysis, and the atlas reads it as a gap on the profile.","posting_quote":"Win/loss language folded back into battlecards"},"why_company":{"text":"Press names CreatorIQ, Grin and Captiv8 as rivals, but their pricing is private. YouTube's Creator Partnerships and Collabstr are the two alternatives a brand can read about in public. So they are the two a student can card honestly.","research_file":"build_surfaces.md","url":"https://collabstr.com/pricing"},"why_person":{"text":"The objection sheet she wrote for a sales team is a battlecard by another name. The new part is a competitor she has never met across a table.","profile_quote":"Wrote the discovery-call guide and the objection sheet the sales team used"},"atlas_skills":["market_research","sales_enablement","enterprise_saas","positioning_messaging"],"classes":["TECH 5111"],"sources":[{"title":"Collabstr pricing","url":"https://collabstr.com/pricing","read":"2026-10-26"},{"title":"YouTube Creator Partnerships at NewFronts 2026","url":"https://blog.youtube/news-and-events/youtube-creator-partnerships-newfronts-2026/","read":"2026-10-26"},{"title":"Yespress: Agentio profile and competitors","url":"https://yespress.io/agentio","read":"2026-10-26"}]},{"id":"l2-howitworks","level":2,"track":"technical","title":"How it works, in 300 words a CMO forwards","ship":"A website-style product page section and a launch-email draft that explain the AI-native platform (matching, pricing on expected views, the review agent, Meta Creative Intelligence) in plain words, every number carrying its source and its window, with a one-paragraph note on what the page deliberately does not claim.","hours":8,"window":"a day","why_role":{"text":"Customer-facing framing for emails, posts and product pages is on the posting's list. The atlas reads AI fluency as the profile's thinnest core skill. A forwardable explainer proves both at once.","posting_quote":"Customer-facing framing for launch emails, LinkedIn posts and website product pages"},"why_company":{"text":"Agentio's AI claims are the company's bet and the part the press treats with most caution. Its January post defines AI-native, and the July release describes Creative Intelligence. So a student can build a plain-language page from the company's own words.","research_file":"values_and_bets.md","url":"https://www.prnewswire.com/news-releases/agentio-brings-automated-creator-advertising-to-facebook-and-instagram-302823870.html"},"why_person":{"text":"She explained freight software to forwarders who did not care how it worked until it cost them. The audience changes; the skill of making a system plain does not.","profile_quote":"Pitched the suite at two logistics trade shows in Mumbai and Dubai, presenting to rooms of 40 to 80 forwarders"},"atlas_skills":["ai_ml","communication","launch","technical_fluency"],"classes":["TECH 5280"],"sources":[{"title":"Agentio Brings Automated Creator Advertising to Facebook and Instagram (PR Newswire)","url":"https://www.prnewswire.com/news-releases/agentio-brings-automated-creator-advertising-to-facebook-and-instagram-302823870.html","read":"2026-10-26"},{"title":"What AI-Native Actually Means in Creator Marketing","url":"https://www.agentio.com/blog/what-ai-native-actually-means-in-influencer-marketing-and-why-it-matters","read":"2026-10-26"},{"title":"Agentio (Contrary Research memo, Sept 2026)","url":"https://research.contrary.com/company/agentio","read":"2026-10-26"}]},{"id":"l3-brief","level":3,"track":"gtm","title":"A six-week brief for DTC marketers on buying creator ads like a performance channel","ship":"Six weekly issues, published on a public page with an email list, each turning one public measurement fact into something a performance marketer can use (engaged views and the 67% overpay, 90-day amortization, post-purchase surveys, the 1.5x to 3x pixel multiplier, Meta creative fatigue at 36 days, the IAB measurement landscape), with Agentio's and competitors' public material as the sources; the sixth issue is a reader survey and a changelog of what readers corrected.","hours":60,"window":"6 weeks, at 10 hours a week","why_role":{"text":"Measurement guidance is on the posting's list of what the role owns. A brief that readers correct is the fastest way to learn which claims sophisticated audiences trust.","posting_quote":"measurement guidance and onboarding playbook"},"why_company":{"text":"Measurement is the bet nobody outside Agentio has verified. Agentio's own measurement guide, engaged-view post and Fairing launch are the richest public material it has. None of it speaks to the buyer's side yet.","research_file":"build_surfaces.md","url":"https://www.agentio.com/blog/measurement-guide"},"why_person":{"text":"She has run exactly this before, for two years, to 4,000 practitioners, and kept it independent. The audience is new; the form is hers.","profile_quote":"Grew the group to 4,000 members by invitation and referral, with weekly moderation and a posting code"},"atlas_skills":["positioning_messaging","market_research","content_social","communication","data_driven"],"classes":["NBAY 6090","TECH 5110"],"users":"Performance and growth marketers at Shopify-sized DTC brands, found where they already talk shop: the Shopify community forum's marketing boards, the r/ecommerce and r/PPC communities, the Cornell Tech MBA cohort's own ecommerce operators, and the fellowship showcase; the target is thirty readers who reply at least once.","sources":[{"title":"A Guide to Measuring YouTube Creator Advertising","url":"https://www.agentio.com/blog/measurement-guide","read":"2026-10-26"},{"title":"One Week Later: YouTube's New View Count Has a 60% Engaged View Rate","url":"https://www.agentio.com/blog/youtube-new-view-count-60-engaged-view-rate","read":"2026-10-26"},{"title":"IAB: As-Is Measurement Landscape in the Creator Economy","url":"https://www.iab.com/guidelines/creator-economy-as-is-measurement-landscape/","read":"2026-10-26"},{"title":"A Playbook to Unlock an Infinite Creative Engine","url":"https://www.agentio.com/blog/infinite-creative-engine","read":"2026-10-26"}]},{"id":"l4-library","level":"reach","track":"technical","title":"Claimkeeper: an enablement library where every number knows its source","ship":"A small product for seed-to-Series-B marketing teams: every claim in a deck, one-pager or battlecard is linked to the launch brief and the public source it came from; when a source changes (a pricing page, a case study, a platform policy), the assets that carry the claim are flagged stale and the owner gets the rewrite queue; built with an LLM that checks each claim against its source, and shipped first to three startups' PMMs.","hours":400,"window":"12 months, part-time through the MBA","why_role":{"text":"The posting makes the enablement system itself a deliverable the role owns, with a one-week freshness rule. A tool that keeps that rule turns the role's second half into a product.","posting_quote":"The enablement system itself: one asset library, every asset current whenever product, pricing or packaging changes"},"why_company":{"text":"Agentio's claims change with every launch and every platform policy change. YouTube's August 2026 view-count change forced an engaged-view restatement within a week. The company treats an inaccurate claim as a reputational risk. The problem is theirs before it is anyone's.","research_file":"role_and_team.md","url":"https://www.agentio.com/blog/youtube-new-view-count-60-engaged-view-rate"},"why_person":{"text":"Keeping sales material current after every pricing change was her job for three years, by hand. She knows the failure mode the product removes.","profile_quote":"kept both current after every pricing or packaging change"},"atlas_skills":["genai_llm","technical_fluency","sales_enablement","product_strategy","launch"],"classes":["TECH 5280","TECH 5910"],"users":"Product marketers and founders at marketing-led startups between seed and Series B, met through the Cornell Tech startup studio, the fellowship's founder network and the Shopify partner community; the first three design partners are chosen for having a sales deck older than their pricing.","sources":[{"title":"One Week Later: YouTube's New View Count Has a 60% Engaged View Rate","url":"https://www.agentio.com/blog/youtube-new-view-count-60-engaged-view-rate","read":"2026-10-26"},{"title":"Product Marketing Lead @ Agentio","url":"https://jobs.ashbyhq.com/agentio/dd1be239-503f-47a8-a7a9-b25854f27371","read":"2026-10-26"},{"title":"Brand Communications & Events Lead @ Agentio","url":"https://jobs.ashbyhq.com/agentio/07130e40-4ce1-4553-bb58-ff8fec187041","read":"2026-10-26"}]}],"skill_labels":{"roadmap":"Roadmapping","product_strategy":"Product strategy","product_vision":"Product vision","prioritization":"Prioritization & trade-offs","prd":"PRDs & requirements writing","product_lifecycle":"End-to-end product lifecycle","launch":"Product launches","feature_definition":"Feature definition & scoping","customer_obsession":"Customer obsession / user empathy","product_sense":"Product sense & judgment","ux_design_collab":"UX & design collaboration","problem_solving":"Structured problem solving","okrs":"OKRs & goal setting","pricing_packaging":"Pricing & packaging","gtm":"Go-to-market strategy","market_research":"Market & competitive analysis","positioning_messaging":"Positioning & messaging","sales_enablement":"Sales enablement & field partnership","customer_success":"Customer success & support partnership","partnerships":"Partnerships & ecosystem","business_case":"Business cases & ROI","pnl":"P&L / revenue ownership","growth_loops":"Growth, funnels & retention","customer_interviews":"Customer interviews","user_research":"User research","discovery":"Product discovery & validation","personas_jtbd":"Personas & segmentation","surveys_feedback":"Surveys & feedback loops","metrics_kpis":"Metrics & KPIs","data_driven":"Data-driven decision making","ab_testing":"A/B testing & experimentation","sql":"SQL","python_r":"Python / R / scripting","data_modeling":"Data modeling & pipelines","statistics":"Statistics & forecasting","financial_analysis":"Financial modeling & analysis","technical_fluency":"Technical fluency","apis":"APIs & integrations","syste <script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("map-data").textContent);
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
  var el = function (id) { return document.getElementById(id); };
  var skillName = function (id) { return (D.skill_labels || {})[id] || id; };
  var classLine = function (code) { var t = (D.class_titles || {})[code]; return t ? code + " · " + t : code; };
  // the worlds are the levels in order: 1, 2, 3, then the Reach when the map has one
  var levels = D.worlds.map(function (w) { return { n: String(w.n), label: w.label, release: w.release, who: w.who, clear: w.clear, missions: w.missions || [], reach: w.n === "reach" }; });
  var levelName = function (l) { return l.reach ? l.label : "Level " + l.n + " · " + l.label; };
  var tracks = D.tracks;
  var cards = D.cards;
  var byId = {}; cards.forEach(function (c) { byId[c.id] = c; });
  var openId = null;

  // ---------- header and footer ----------
  el("name").textContent = D.student.name_on_page;
  el("sub").innerHTML = esc(D.role.label) + " at <a href=\"" + esc(D.company.url) + "\">" + esc(D.company.name) + "</a>" +
    (D.posting && D.posting.url ? " · <a href=\"" + esc(D.posting.url) + "\">" + esc(D.posting.title || "the posting") + "</a>" : "") +
    (D.student.program ? " · " + esc(D.student.program) + ", " + esc(D.student.campus) : "");
  el("gapline").textContent = D.gap_sentence;
  el("names").textContent = "This page uses a made-up name, never the student's own." + (D.student.fictional ? " In this example the person is fictional as well; the company, the posting and every source are real." : "");
  el("foot").textContent = "Grounded in " + D.role.postings_n + " postings for " + D.role.label + " · product-role-atlas" + (D.atlas_generated ? " (postings as of " + D.atlas_generated + ")" : "") + " · " + D.rendered;
  document.title = D.student.name_on_page + " · " + D.role.label + " at " + D.company.name;

  // ---------- the grid ----------
  var grid = el("grid");
  // what the owner set at a republish, from the student's feedback
  var statusOf = function (c) { return c.shipped ? " · shipped " + c.shipped : c.declined ? " · declined" : c.changed ? " · changed " + c.changed : ""; };
  var cell = {};   // cell[track][level] = [cards]
  tracks.forEach(function (t) { cell[t.id] = {}; levels.forEach(function (l) { cell[t.id][l.n] = []; }); });
  cards.forEach(function (c) { if (cell[c.track] && cell[c.track][String(c.level)]) cell[c.track][String(c.level)].push(c); });
  // a world clears after k of its n missions; a declined mission leaves n; the Reach never clears or blocks
  var clearLine = function (l) {
    if (l.reach) return "Optional. It never blocks a world.";
    var n = l.missions.filter(function (id) { return byId[id] && !byId[id].declined; }).length;
    if (n === 1 && l.clear === 1) return "Ship this one to clear.";
    return "Ship " + l.clear + " of these " + n + " to clear.";
  };
  grid.style.gridTemplateColumns = "150px repeat(" + levels.length + ", minmax(150px, 1fr))";
  var html = "<div class=\"trk\" role=\"columnheader\"></div>";
  levels.forEach(function (l) { html += "<div class=\"lvl\" role=\"columnheader\"><b>" + esc(levelName(l)) + "</b><span class=\"rel\">" + esc(l.release) + "</span><span class=\"clear\">" + esc(clearLine(l)) + "</span></div>"; });
  tracks.forEach(function (t) {
    html += "<div class=\"trk\" role=\"rowheader\">" + esc(t.label) + "<small>" + esc(t.atlas_area) + "</small></div>";
    levels.forEach(function (l) {
      html += "<div class=\"cell\" role=\"gridcell\">";
      cell[t.id][l.n].forEach(function (c) { html += "<button type=\"button\" class=\"card" + (c.declined ? " declined" : "") + "\" data-id=\"" + esc(c.id) + "\" data-level=\"" + esc(l.n) + "\" data-track=\"" + esc(t.id) + "\" aria-expanded=\"false\"><b>" + esc(c.title) + "</b><span>" + esc(c.window) + (c.hours ? " · " + esc(c.hours) + " h" : "") + esc(statusOf(c)) + "</span></button>"; });
      html += "</div>";
    });
  });
  grid.innerHTML = html;
  var buttons = Array.prototype.slice.call(grid.querySelectorAll(".card"));
  buttons.forEach(function (b, i) { b.tabIndex = i === 0 ? 0 : -1; b.addEventListener("click", function () { toggle(b.dataset.id); }); });

  // ---------- the open card ----------
  function toggle(id) { if (openId === id) close(); else open(id); }
  function open(id) {
    var c = byId[id]; if (!c) return;
    openId = id;
    buttons.forEach(function (b) { var on = b.dataset.id === id; b.classList.toggle("open", on); b.setAttribute("aria-expanded", on ? "true" : "false"); });
    var lvl = levels.filter(function (l) { return l.n === String(c.level); })[0] || {};
    var trk = tracks.filter(function (t) { return t.id === c.track; })[0] || {};
    var h = "<button type=\"button\" class=\"btn close\" id=\"closeBtn\">Close</button>";
    h += "<div class=\"eyebrow\">" + esc(levelName(lvl)) + " · " + esc(lvl.release) + " · " + esc(trk.label) + esc(statusOf(c)) + "</div>";
    h += "<h2>" + esc(c.title) + "</h2>";
    h += "<p class=\"ship\"><b>Ships:</b> " + esc(c.ship) + "</p>";
    h += "<div class=\"why\">";
    h += "<div><h3>Why the role</h3>" + esc(c.why_role.text) + "<q>“" + esc(c.why_role.posting_quote) + "” — the posting</q></div>";
    h += "<div><h3>Why " + esc(D.company.name) + "</h3>" + esc(c.why_company.text) + "<span class=\"ev\">Research: " + esc(c.why_company.research_file) + " · <a href=\"" + esc(c.why_company.url) + "\">source</a></span></div>";
    h += "<div><h3>Why " + esc(D.student.name_on_page.split(" ")[0]) + "</h3>" + esc(c.why_person.text) + "<q>“" + esc(c.why_person.profile_quote) + "” — the profile</q></div>";
    h += "</div><dl>";
    h += "<dt>Window</dt><dd>" + esc(c.window) + (c.hours ? " · about " + esc(c.hours) + " hours" : "") + "</dd>";
    h += "<dt>Skills</dt><dd class=\"chips\">" + (c.atlas_skills || []).map(function (s) { return "<span class=\"chip\">" + esc(skillName(s)) + "</span>"; }).join("") + "</dd>";
    if (c.classes && c.classes.length) h += "<dt>Classes</dt><dd>" + c.classes.map(function (k) { return esc(classLine(k)); }).join("<br>") + "</dd>";
    if (c.users) h += "<dt>Users</dt><dd>" + esc(c.users) + "</dd>";
    if (c.reply && c.reply.text) h += "<dt>Reply</dt><dd>" + esc(c.reply.text) + (c.reply.date ? " (" + esc(c.reply.date) + ")" : "") + "</dd>";
    h += "<dt>Sources</dt><dd><ul class=\"src\">" + (c.sources || []).map(function (s) { return "<li><a href=\"" + esc(s.url) + "\">" + esc(s.title) + "</a>" + (s.read ? " <span class=\"ev\" style=\"display:inline\">(read " + esc(s.read) + ")</span>" : "") + "</li>"; }).join("") + "</ul></dd>";
    h += "</dl>";
    var d = el("detail"); d.innerHTML = h; d.hidden = false;
    el("closeBtn").addEventListener("click", function () { close(true); });
  }
  function close(refocus) {
    var was = openId; openId = null;
    buttons.forEach(function (b) { b.classList.remove("open"); b.setAttribute("aria-expanded", "false"); });
    var d = el("detail"); d.hidden = true; d.innerHTML = "";
    if (refocus && was) { var b = grid.querySelector(".card[data-id=\"" + was + "\"]"); if (b) b.focus(); }
  }

  // ---------- the keyboard: arrows move between cards, Enter opens, Escape closes ----------
  var levelIdx = function (n) { return levels.findIndex(function (l) { return l.n === n; }); };
  var trackIdx = function (id) { return tracks.findIndex(function (t) { return t.id === id; }); };
  function firstIn(t, l) { return (cell[tracks[t].id] || {})[levels[l].n] || []; }
  function move(from, dx, dy) {
    var t = trackIdx(from.dataset.track), l = levelIdx(from.dataset.level);
    var list = firstIn(t, l), k = list.findIndex(function (c) { return c.id === from.dataset.id; });
    if (dy && !dx) {   // up and down: next card in the same column, by track order; within a cell first
      if (dy > 0 && k < list.length - 1) return list[k + 1];
      if (dy < 0 && k > 0) return list[k - 1];
      for (var tt = t + dy; tt >= 0 && tt < tracks.length; tt += dy) { var cs = firstIn(tt, l); if (cs.length) return dy > 0 ? cs[0] : cs[cs.length - 1]; }
      return null;
    }
    for (var ll = l + dx; ll >= 0 && ll < levels.length; ll += dx) {   // left and right: the same track first, else any card at that level
      var same = firstIn(t, ll); if (same.length) return same[0];
      for (var t2 = 0; t2 < tracks.length; t2++) { var any = firstIn(t2, ll); if (any.length) return any[0]; }
    }
    return null;
  }
  function focusCard(c) { var b = grid.querySelector(".card[data-id=\"" + c.id + "\"]"); if (!b) return; buttons.forEach(function (x) { x.tabIndex = -1; }); b.tabIndex = 0; b.focus(); }
  grid.addEventListener("keydown", function (e) {
    var b = e.target.closest ? e.target.closest(".card") : null; if (!b) return;
    var next = null;
    if (e.key === "ArrowRight") next = move(b, 1, 0); else if (e.key === "ArrowLeft") next = move(b, -1, 0);
    else if (e.key === "ArrowDown") next = move(b, 0, 1); else if (e.key === "ArrowUp") next = move(b, 0, -1);
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(b.dataset.id); return; }
    else return;
    e.preventDefault(); if (next) focusCard(next);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openId) close(true); });
  el("printBtn").addEventListener("click", function () { window.print(); });

  // ---------- the one-page summary for print: the levels as columns, every card with what it ships ----------
  var p = "";
  levels.forEach(function (l) {
    p += "<section><h2>" + esc(levelName(l)) + "</h2><div class=\"rel\">" + esc(l.release) + " · " + esc(clearLine(l)) + "</div>";
    cards.filter(function (c) { return String(c.level) === l.n; }).forEach(function (c) {
      var trk = tracks.filter(function (t) { return t.id === c.track; })[0] || {};
      p += "<article><b>" + esc(c.title) + "</b><i>" + esc(trk.label) + " · " + esc(c.window) + "</i><p>" + esc(c.ship) + "</p></article>";
    });
    p += "</section>";
  });
  el("print").innerHTML = p;

  // ---------- the class tree and the read, as plain lists: the owner's check view, not the atlas's drawing ----------
  var T = D.tree || { nodes: [], behaviours: [], more: [] }, RD = D.read || {};
  var roles = ((D.role_class || {}).roles) || [];
  var roleLabel = function (id) { var r = roles.filter(function (x) { return x.id === id; })[0]; return r ? r.label : id; };
  var STATE = { "shows": "Shows", "shows in other words": "Shows in other words", "must evidence better": "Must evidence better", "must build": "Must build" };
  var nameOf = function (id) { var all = T.nodes.concat(T.behaviours, T.more); var n = all.filter(function (x) { return x.id === id; })[0]; return n ? n.name : skillName(id); };
  var item = function (n, withRoles) {
    return "<li>" + esc(n.name) + " <span class=\"st\">· " + esc(STATE[n.state] || n.state) + "</span>" +
      (n.posting_names ? "<span class=\"mark\">The posting names it</span>" : "") + (n.grows ? "<span class=\"mark\">Asked more at senior levels</span>" : "") +
      (withRoles ? " <span class=\"st\">(" + esc(n.roles.map(roleLabel).join(", ")) + ")</span>" : "") + "</li>";
  };
  var list = function (ns, withRoles) { return ns.length ? "<ul>" + ns.map(function (n) { return item(n, withRoles); }).join("") + "</ul>" : "<p class=\"st\">None.</p>"; };
  var t = "<h2>The class tree · " + esc((D.role_class || {}).label || "") + "</h2>";
  t += "<p class=\"st\">This list lets you check the map. The atlas draws the tree itself.</p>";
  t += "<p><b>" + esc(RD.band_label || "") + "</b> for " + esc(D.role.label) + ".</p>";
  t += "<p>What you already bring: " + esc((RD.brings || []).map(function (b) { return b.name; }).join(", ") || "nothing yet") + ".</p>";
  t += "<p>The gaps the quests aim at: " + esc((RD.marked_gaps || []).map(nameOf).join(", ") || "none") + ".</p>";
  t += "<h3>Trunk: every role asks for these</h3>" + list(T.nodes.filter(function (n) { return n.place === "trunk"; }), false);
  t += "<h3>Shared: two or more roles ask for these</h3>" + list(T.nodes.filter(function (n) { return n.place === "shared"; }), true);
  roles.forEach(function (r) {
    var own = T.nodes.filter(function (n) { return n.place === "own" && n.roles[0] === r.id; });
    if (own.length) t += "<h3>Own: only " + esc(r.label) + " asks for these</h3>" + list(own, false);
  });
  t += "<h3>How you work</h3>" + list(T.behaviours, false);
  t += "<h3>More skills these roles sometimes ask for</h3><p>" + esc(T.more.map(function (n) { return n.name + " (" + (STATE[n.state] || n.state).toLowerCase() + ")"; }).join(", ") || "None.") + "</p>";
  el("tree").innerHTML = t;
})();
</script>
</body>
</html>
